<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Binario - Geometría Cristalizada</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222222; color: #F0EAD6; font-family: monospace; user-select: none; }
        .input_video { display: none; } 
        
        /* Contenedor del Panel Animado */
        #panel { 
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(34, 34, 34, 0.85); padding: 20px; 
            border: 1px solid #F0EAD6; z-index: 10; backdrop-filter: blur(4px);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Clase que oculta el panel moviéndolo fuera de la pantalla */
        #panel.oculto {
            transform: translateX(calc(-100% - 20px));
        }

        /* Botón Pestaña para ocultar/mostrar */
        #btnOcultar {
            position: absolute;
            right: -30px; /* Sale del borde derecho del panel */
            top: -1px; /* Alineado con el borde superior */
            width: 30px;
            height: 40px;
            background: rgba(34, 34, 34, 0.85);
            border: 1px solid #F0EAD6;
            border-left: none; /* Se fusiona con el panel */
            color: #F0EAD6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #btnOcultar:hover {
            background: #F0EAD6;
            color: #222222;
        }
        
        h3 { margin: 0 0 15px 0; border-bottom: 1px solid #F0EAD6; padding-bottom: 10px; letter-spacing: 2px; }
        label { font-size: 11px; display: block; margin-top: 15px; font-weight: bold; }
        
        input[type="text"] { 
            width: 100%; background: #222; border: 1px solid #F0EAD6; 
            color: #F0EAD6; padding: 8px; margin-top: 5px; box-sizing: border-box; font-family: monospace; outline: none;
        }
        
        .btn-accion { 
            width: 100%; padding: 10px; margin-top: 15px; 
            background: #F0EAD6; color: #222; border: none; 
            cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-accion:hover { background: #ffffff; }

        .btn-nav-group {
            display: flex; gap: 10px; margin-top: 10px;
        }

        .btn-nav {
            flex: 1; padding: 8px; background: transparent; color: #F0EAD6;
            border: 1px solid #F0EAD6; cursor: pointer; font-family: monospace;
            font-size: 10px; text-transform: uppercase; font-weight: bold; transition: all 0.3s;
        }
        .btn-nav:hover { background: rgba(240, 234, 214, 0.2); }
        
        .status { margin-top: 15px; font-size: 11px; font-weight: bold; color: #F0EAD6; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>

    <video class="input_video" autoplay playsinline></video>
    <canvas id="lienzo"></canvas>

    <div id="panel">
        <div id="btnOcultar">◀</div>
        <h3>Matriz Geométrica</h3>
        
        <label>ID DEL ESPECTADOR:</label>
        <input type="text" id="inputNombre" value="Arte">
        
        <button id="btnGenerar" class="btn-accion">Restaurar Proporción</button>
        
        <div class="btn-nav-group">
            <button id="btnInicio" class="btn-nav">◄ Inicio</button>
            <button id="btnAbstraccion" class="btn-nav">Abstracción ►</button>
        </div>
        
        <div id="cameraStatus" class="status">Iniciando IA Espacial...</div>
    </div>

    <script>
        // ==========================================
        // SISTEMA DE OCULTAMIENTO DEL PANEL
        // ==========================================
        const panel = document.getElementById('panel');
        const btnOcultar = document.getElementById('btnOcultar');

        btnOcultar.addEventListener('click', () => {
            panel.classList.toggle('oculto');
            if (panel.classList.contains('oculto')) {
                btnOcultar.innerText = '▶'; // Flecha apuntando a la derecha para desplegar
            } else {
                btnOcultar.innerText = '◀'; // Flecha apuntando a la izquierda para ocultar
            }
        });

        // ==========================================
        // SÍNTESIS SONORA INTERESTELAR
        // ==========================================
        let audioCtx, masterGain, audioIniciado = false;
        
        function iniciarAudio() {
            if (audioIniciado) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.15; // Volumen suave
            masterGain.connect(audioCtx.destination);

            // Acorde etéreo: La Mayor (A2, E3, C#4)
            const frecuencias = [110.00, 164.81, 277.18]; 
            
            frecuencias.forEach(freq => {
                let osc = audioCtx.createOscillator();
                osc.type = 'sine'; // Onda pura
                osc.frequency.value = freq;
                
                let oscGain = audioCtx.createGain();
                oscGain.gain.value = 0.3;
                
                // LFO para que las frecuencias "respiren" y simulen titilar
                let lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.05 + (Math.random() * 0.05); // Pulsación asíncrona lenta
                
                let lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 0.2; 
                
                lfo.connect(lfoGain);
                lfoGain.connect(oscGain.gain);
                
                osc.connect(oscGain);
                oscGain.connect(masterGain);
                
                osc.start();
                lfo.start();
            });
            audioIniciado = true;
        }

        // Iniciar audio al primer clic en cualquier parte
        document.body.addEventListener('click', iniciarAudio, { once: true });

        // ==========================================
        // NAVEGACIÓN BINART
        // ==========================================
        document.getElementById('btnInicio').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('btnAbstraccion').addEventListener('click', () => {
            // Carga aleatoria de la siguiente abstracción
            const abstracciones = ['esculturaaurea.html', 'galaxia.html', 'galaxia2manos.html', 'binart.html'];
            // Evitar recargar la misma página si está en la lista
            const destino = abstracciones[Math.floor(Math.random() * abstracciones.length)];
            window.location.href = destino;
        });

        // Recuperar nombre del index si existe
        const nombreGuardado = localStorage.getItem('binart_user');
        if (nombreGuardado) {
            document.getElementById('inputNombre').value = nombreGuardado;
        }

        // ==========================================
        // LÓGICA GRÁFICA Y DE IA
        // ==========================================
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        const inputNombre = document.getElementById('inputNombre');
        const btnGenerar = document.getElementById('btnGenerar');
        const cameraStatus = document.getElementById('cameraStatus');

        let width, height;
        let nodos = [];
        let sistemaActivo = false;
        
        let manoX = -1000, manoY = -1000;
        let isPinching = false;
        let mouseX = -1000, mouseY = -1000;
        let isMouseDown = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#222222';
            ctx.fillRect(0, 0, width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        // MOTOR DE IA (MediaPipe)
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indice = landmarks[8]; 
                const pulgar = landmarks[4];
                
                manoX = (1 - indice.x) * width; 
                manoY = indice.y * height;
                
                let distanciaDedos = Math.hypot(indice.x - pulgar.x, indice.y - pulgar.y);
                
                if (distanciaDedos < 0.06) { 
                    isPinching = true;
                    sistemaActivo = true; 
                } else { 
                    isPinching = false;
                }
            } else {
                manoX = -1000; manoY = -1000; isPinching = false;
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                cameraStatus.innerText = "Cámara y Gestos: ACTIVOS";
                cameraStatus.style.color = "#5cb85c";
                await hands.send({image: videoElement}); 
            },
            width: 640, height: 480
        });
        camera.start();

        window.addEventListener('mousedown', (e) => { 
            // Prevenir interacción del lienzo si el clic fue dentro del panel
            if (e.target.closest('#panel')) return;
            isMouseDown = true; 
            sistemaActivo = true; 
            mouseX = e.clientX; 
            mouseY = e.clientY; 
        });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        // FÍSICAS CRISTALINAS
        class Nodo {
            constructor(x, y, tipo) {
                this.x = x; this.y = y; 
                this.tipo = tipo; 
                this.vx = 0; this.vy = 0; 
            }

            actualizar() {
                if (!sistemaActivo) return;

                this.x += this.vx; this.y += this.vy;

                if (this.x <= 0 || this.x >= width) this.vx *= -1;
                if (this.y <= 0 || this.y >= height) this.vy *= -1;

                this.vx *= 0.65; 
                this.vy *= 0.65; 

                if (Math.abs(this.vx) < 0.1) this.vx = 0;
                if (Math.abs(this.vy) < 0.1) this.vy = 0;
            }
        }

        function generarMatriz() {
            iniciarAudio(); // Asegura el audio al presionar el botón
            nodos = [];
            sistemaActivo = false;
            
            let nombre = inputNombre.value || "Arte";
            const bin = nombre.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('');
            
            let cx = width / 2; let cy = height / 2;
            let escala = 18; 
            const anguloAureo = 137.5 * (Math.PI / 180);

            for (let i = 0; i < bin.length; i++) {
                let tipo = parseInt(bin[i]);
                let radio = escala * Math.sqrt(i);
                let theta = i * anguloAureo;
                
                nodos.push(new Nodo(cx + radio * Math.cos(theta), cy + radio * Math.sin(theta), tipo));
            }
        }

        // RENDERIZADO GEOMÉTRICO
        function dibujar() {
            ctx.fillStyle = '#222222'; 
            ctx.fillRect(0, 0, width, height);

            let targetX = manoX > 0 ? manoX : mouseX;
            let targetY = manoY > 0 ? manoY : mouseY;
            let interactuando = isPinching || isMouseDown;

            if (!sistemaActivo && nodos.length > 0) {
                ctx.beginPath();
                ctx.moveTo(nodos[0].x, nodos[0].y);
                for (let i = 1; i < nodos.length; i++) {
                    ctx.lineTo(nodos[i].x, nodos[i].y);
                }
                ctx.strokeStyle = 'rgba(240, 234, 214, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            if (sistemaActivo) {
                for (let i = 0; i < nodos.length; i++) {
                    let a = nodos[i];

                    if (interactuando && targetX > 0) {
                        let dxMouse = targetX - a.x;
                        let dyMouse = targetY - a.y;
                        let dMouse = Math.hypot(dxMouse, dyMouse);
                        
                        if (dMouse < 180) {
                            a.vx -= (dxMouse / dMouse) * 3;
                            a.vy -= (dyMouse / dMouse) * 3;
                        }
                    }

                    for (let j = i + 1; j < nodos.length; j++) {
                        let b = nodos[j];
                        let dx = b.x - a.x; 
                        let dy = b.y - a.y;
                        let d = Math.hypot(dx, dy);

                        if (a.tipo === 0 && b.tipo === 0) {
                            if (d < 140) { 
                                let distIdeal = 50; 
                                let tension = (d - distIdeal) * 0.1; 
                                
                                a.vx += dx/d * tension; a.vy += dy/d * tension;
                                b.vx -= dx/d * tension; b.vy -= dy/d * tension;

                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y); 
                                ctx.lineTo(b.x, b.y);
                                ctx.strokeStyle = `rgba(240, 234, 214, ${1 - d/140})`;
                                ctx.lineWidth = 1.5;
                                ctx.stroke();
                            }
                        }

                        if ((a.tipo === 1 && b.tipo === 0) || (a.tipo === 0 && b.tipo === 1)) {
                            if (d < 70) { 
                                let repulsa = 0.5;
                                if (a.tipo === 1) { a.vx += dx/d * repulsa; a.vy += dy/d * repulsa; }
                                if (b.tipo === 1) { b.vx -= dx/d * repulsa; b.vy -= dy/d * repulsa; }
                            }
                        }
                    }
                }
            }

            for (let i = 0; i < nodos.length; i++) {
                let a = nodos[i];
                a.actualizar();

                ctx.beginPath();
                if (a.tipo === 0) {
                    ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#F0EAD6';
                    ctx.fill();
                } else {
                    ctx.arc(a.x, a.y, 2, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(240, 234, 214, 0.6)`;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            if (manoX > 0 || isMouseDown) {
                let ptX = manoX > 0 ? manoX : mouseX;
                let ptY = manoY > 0 ? manoY : mouseY;
                ctx.beginPath();
                ctx.arc(ptX, ptY, interactuando ? 15 : 6, 0, Math.PI * 2);
                ctx.strokeStyle = interactuando ? '#F0EAD6' : 'rgba(240, 234, 214, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            requestAnimationFrame(dibujar);
        }

        btnGenerar.addEventListener('click', () => {
            localStorage.setItem('binart_user', inputNombre.value);
            generarMatriz();
        });
        
        generarMatriz();
        dibujar();
    </script>
</body>
</html>
