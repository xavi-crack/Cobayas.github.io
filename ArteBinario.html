<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrelazamiento Binario Sensitivo - Biometría Óptica</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #F0EAD6; font-family: 'Courier New', Courier, monospace; }
        
        .input_video { display: none; }
        
        /* --- SISTEMA RETRÁCTIL CORREGIDO --- */
        #ui-wrapper { 
            position: absolute; 
            top: 30px; 
            left: 30px; /* Posición inicial */
            z-index: 10;
            display: flex;
            align-items: flex-start;
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Oculta exactamente los 300px del panel, dejando el botón visible */
        #ui-wrapper.oculto {
            left: -300px;
        }

        #ui-panel { 
            width: 300px;
            background: rgba(240, 234, 214, 0.9); 
            padding: 25px; 
            border: 1px solid #222222; 
            border-radius: 2px 0 0 2px;
            box-sizing: border-box;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        #toggleBtn {
            width: 40px;
            height: 50px;
            background: #222222;
            color: #F0EAD6;
            border: 1px solid #222222;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        #toggleBtn:hover { opacity: 0.8; }

        h3 { font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; margin-top: 0;}
        input[type="text"] { 
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #222; 
            color: #222; padding: 5px 0; margin-top: 5px; font-family: inherit; font-size: 16px; box-sizing: border-box;
        }
        .btn-accion { 
            width: 100%; padding: 12px; margin-top: 25px; 
            background: #222222; color: #F0EAD6; border: none; 
            cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold;
        }
        .status { margin-top: 15px; font-size: 11px; font-weight: bold; color: #222; }
        .bpm-display { font-size: 24px; font-weight: bold; margin-top: 10px; color: #d9534f; }
        
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }
    </style>
</head>
<body>

    <video class="input_video" autoplay playsinline></video>
    <canvas id="lienzo"></canvas>

    <div id="ui-wrapper">
        <div id="ui-panel">
            <h3>Entrelazamiento Binario</h3>
            
            <label style="font-size: 11px; font-weight: bold;">ID DEL ESPECTADOR:</label>
            <input type="text" id="nameInput" value="Mondrian">
            
            <div style="margin-top: 20px;">
                <label style="font-size: 11px; font-weight: bold;">RITMO CARDÍACO REAL (rPPG):</label>
                <div class="bpm-display"><span id="bpmValue">--</span> BPM</div>
            </div>

            <button id="generateBtn" class="btn-accion">Transmutar Impresión</button>
            <div id="cameraStatus" class="status">Calibrando Sensores Ópticos...</div>
            
            <p style="font-size: 10px; opacity: 0.8; margin-top: 20px;">
                * Mantén tu rostro en el centro e iluminado.<br>
                * Usa el cursor o la pantalla táctil para alterar la geometría.<br>
                * El rastro dibuja la emoción pura.
            </p>
        </div>
        <button id="toggleBtn" title="Ocultar/Mostrar">◀</button>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const generateBtn = document.getElementById('generateBtn');
        const cameraStatus = document.getElementById('cameraStatus');
        const bpmValue = document.getElementById('bpmValue');
        
        const toggleBtn = document.getElementById('toggleBtn');
        const uiWrapper = document.getElementById('ui-wrapper');

        let width, height;
        let nodos = [];
        let tiempo = 0;
        
        // Variables Hápticas
        let mouse = { x: -1000, y: -1000 };
        let nodoAgarrado = null;

        // Variables de Biometría (rPPG)
        let latidoReal = 75; 
        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', {willReadFrequently: true});
        let greenSignal = [];
        let lastPeakTime = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#F0EAD6';
            ctx.fillRect(0, 0, width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        toggleBtn.addEventListener('click', () => {
            uiWrapper.classList.toggle('oculto');
            toggleBtn.innerHTML = uiWrapper.classList.contains('oculto') ? '▶' : '◀';
        });

        // Eventos táctiles y de mouse
        function down(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            let minDist = 40;
            nodoAgarrado = null;
            nodos.forEach(n => {
                if (Math.hypot(x - n.x, y - n.y) < minDist) { nodoAgarrado = n; }
            });
        }
        function up() { nodoAgarrado = null; }
        function move(e) { 
            mouse.x = e.touches ? e.touches[0].clientX : e.clientX; 
            mouse.y = e.touches ? e.touches[0].clientY : e.clientY; 
        }

        window.addEventListener('mousedown', down);
        window.addEventListener('mouseup', up);
        window.addEventListener('mousemove', move);
        window.addEventListener('touchstart', down, {passive: false});
        window.addEventListener('touchend', up);
        window.addEventListener('touchmove', move, {passive: false});

        // ==========================================
        // EXTRACCIÓN DE LATIDO (rPPG ALGORITHM)
        // ==========================================
        function calcularBPM_rPPG() {
            if (videoElement.readyState !== 4) return;

            hiddenCanvas.width = videoElement.videoWidth;
            hiddenCanvas.height = videoElement.videoHeight;
            hiddenCtx.drawImage(videoElement, 0, 0);

            // Escanear una caja de 50x50 píxeles en el centro del video (la frente)
            let cx = hiddenCanvas.width / 2;
            let cy = hiddenCanvas.height / 3;
            let frameData = hiddenCtx.getImageData(cx - 25, cy - 25, 50, 50).data;
            
            // Extraer el promedio del canal Verde (G)
            let sumG = 0;
            let totalPixels = frameData.length / 4;
            for(let i = 1; i < frameData.length; i += 4) { sumG += frameData[i]; }
            let avgG = sumG / totalPixels;

            let now = performance.now();
            greenSignal.push({val: avgG, time: now});

            // Mantener solo los últimos 4 segundos de memoria de luz (aprox 120 frames)
            if (greenSignal.length > 120) { greenSignal.shift(); }

            // Lógica simple de detección de picos (Latidos)
            if (greenSignal.length > 30) {
                let sum = 0;
                for (let s of greenSignal) sum += s.val;
                let mean = sum / greenSignal.length;

                // Si el valor actual cae por debajo del promedio (la sangre absorbe luz verde)
                let current = greenSignal[greenSignal.length - 1];
                let previous = greenSignal[greenSignal.length - 2];

                if (previous.val >= mean && current.val < mean) {
                    let timeDiff = current.time - lastPeakTime;
                    // Filtramos latidos irreales (limite entre 45 y 180 BPM)
                    if (timeDiff > 330 && timeDiff < 1300) { 
                        let instantBPM = Math.round(60000 / timeDiff);
                        // Suavizamos el cambio de BPM
                        latidoReal = Math.round((latidoReal * 0.7) + (instantBPM * 0.3));
                        bpmValue.innerText = latidoReal;
                    }
                    lastPeakTime = current.time;
                }
            }
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                cameraStatus.innerText = "Conexión Óptica Establecida";
                cameraStatus.style.color = "#5cb85c";
                calcularBPM_rPPG();
            },
            width: 640,
            height: 480
        });
        camera.start();

        // ==========================================
        // LA FÍSICA BINARIA
        // ==========================================
        class Nodo {
            constructor(x, y, tipo) {
                this.x = x; this.y = y; this.tipo = tipo;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.fase = Math.random() * Math.PI * 2;
            }

            actualizar(speedFactor) {
                this.x += this.vx * speedFactor;
                this.y += this.vy * speedFactor;
                if (this.x <= 0 || this.x >= width) this.vx *= -1;
                if (this.y <= 0 || this.y >= height) this.vy *= -1;
                this.vx *= 0.98; this.vy *= 0.98; 
            }
        }

        function generar() {
            ctx.fillStyle = '#F0EAD6';
            ctx.fillRect(0, 0, width, height);
            nodos = [];
            const bin = nameInput.value.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('');
            for (let i = 0; i < bin.length; i++) {
                nodos.push(new Nodo(Math.random() * width, Math.random() * height, parseInt(bin[i])));
            }
        }

        function dibujar() {
            let speedFactor = latidoReal / 75; 
            tiempo += 0.02 * speedFactor;

            // Veladura (Rastro de Carbón)
            ctx.fillStyle = 'rgba(240, 234, 214, 0.015)'; 
            ctx.fillRect(0, 0, width, height);

            nodos.forEach((a, i) => {
                if (a === nodoAgarrado) {
                    a.x = mouse.x; a.y = mouse.y;
                    a.vx = 0; a.vy = 0;
                } else {
                    a.actualizar(speedFactor);
                }

                for (let j = i + 1; j < nodos.length; j++) {
                    let b = nodos[j];
                    let dx = b.x - a.x, dy = b.y - a.y;
                    let d = Math.hypot(dx, dy);

                    if (d < 150) {
                        if (a.tipo === 1 && b.tipo === 1) {
                            let distIdeal = 80;
                            let tension = (d - distIdeal) * 0.001;
                            if (a !== nodoAgarrado) { a.vx += dx * tension; a.vy += dy * tension; }
                            if (b !== nodoAgarrado) { b.vx -= dx * tension; b.vy -= dy * tension; }

                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(34, 34, 34, ${0.1 * (1 - d/150)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        } else if (a.tipo === 0 && b.tipo === 0 && d < 30) {
                            a.vx -= dx * 0.05; a.vy -= dy * 0.05;
                        }
                    }
                }

                ctx.beginPath();
                let radio = a.tipo === 1 ? 2 + Math.sin(tiempo + a.fase) : 1;
                ctx.arc(a.x, a.y, radio, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(34, 34, 34, 0.4)';
                ctx.fill();
            });

            requestAnimationFrame(dibujar);
        }

        generateBtn.addEventListener('click', generar);
        generar();
        dibujar();
    </script>
</body>
</html>
