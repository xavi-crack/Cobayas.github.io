<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrelazamiento Binario Sensitivo - Obra Completa</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #F0EAD6; font-family: 'Courier New', Courier, monospace; }
        .input_video { display: none; } /* Video oculto, solo sirve de sensor */
        
        /* SISTEMA RETRÁCTIL DEL MENÚ */
        #ui-wrapper { 
            position: absolute; top: 30px; left: 30px; z-index: 10;
            display: flex; align-items: flex-start;
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #ui-wrapper.oculto { left: -300px; }

        #ui-panel { 
            width: 300px; background: rgba(240, 234, 214, 0.9); 
            padding: 25px; border: 1px solid #222222; 
            border-radius: 2px 0 0 2px; box-sizing: border-box;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        #toggleBtn {
            width: 40px; height: 50px; background: #222222; color: #F0EAD6;
            border: 1px solid #222222; cursor: pointer; border-radius: 0 4px 4px 0;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        #toggleBtn:hover { opacity: 0.8; }

        h3 { font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; margin-top: 0;}
        input[type="text"] { 
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #222; 
            color: #222; padding: 5px 0; margin-top: 5px; font-family: inherit; font-size: 16px; box-sizing: border-box;
        }
        .btn-accion { 
            width: 100%; padding: 12px; margin-top: 25px; 
            background: #222222; color: #F0EAD6; border: none; 
            cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold;
        }
        .status { margin-top: 15px; font-size: 11px; font-weight: bold; color: #222; }
        .bpm-display { font-size: 24px; font-weight: bold; margin-top: 10px; color: #222222; }
        
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }
    </style>
</head>
<body>

    <video class="input_video" autoplay playsinline></video>
    <canvas id="lienzo"></canvas>

    <div id="ui-wrapper">
        <div id="ui-panel">
            <h3>Entrelazamiento Binario</h3>
            
            <label style="font-size: 11px; font-weight: bold;">ID DEL ESPECTADOR:</label>
            <input type="text" id="nameInput" value="Mondrian">
            
            <div style="margin-top: 20px;">
                <label style="font-size: 11px; font-weight: bold;">RITMO CARDÍACO (rPPG):</label>
                <div class="bpm-display"><span id="bpmValue">--</span> BPM</div>
            </div>

            <button id="generateBtn" class="btn-accion">Transmutar Impresión</button>
            <div id="cameraStatus" class="status">Calibrando IA Espacial y Biometría...</div>
            
            <p style="font-size: 10px; opacity: 0.8; margin-top: 20px;">
                * Tu rostro dicta el pulso vital.<br>
                * Junta los dedos en el aire para atrapar los nodos físicos.
            </p>
        </div>
        <button id="toggleBtn" title="Ocultar/Mostrar">◀</button>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const generateBtn = document.getElementById('generateBtn');
        const cameraStatus = document.getElementById('cameraStatus');
        const bpmValue = document.getElementById('bpmValue');
        
        const toggleBtn = document.getElementById('toggleBtn');
        const uiWrapper = document.getElementById('ui-wrapper');

        let width, height;
        let nodos = [];
        let tiempo = 0;
        
        // Variables Hápticas (Cámara y Mouse de respaldo)
        let manoX = -1000; let manoY = -1000;
        let mouseX = -1000; let mouseY = -1000;
        let isPinching = false;
        let nodoAgarrado = null;

        // Variables de Biometría
        let latidoReal = 75; 
        const hiddenCanvas = document.createElement('canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', {willReadFrequently: true});
        let greenSignal = [];
        let lastPeakTime = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#F0EAD6';
            ctx.fillRect(0, 0, width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        toggleBtn.addEventListener('click', () => {
            uiWrapper.classList.toggle('oculto');
            toggleBtn.innerHTML = uiWrapper.classList.contains('oculto') ? '▶' : '◀';
        });

        // ==========================================
        // 1. MOTOR DE IA PARA MANOS (MediaPipe)
        // ==========================================
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indice = landmarks[8];
                const pulgar = landmarks[4];

                // Efecto Espejo
                manoX = (1 - indice.x) * width;
                manoY = indice.y * height;

                let distDedos = Math.hypot(indice.x - pulgar.x, indice.y - pulgar.y);
                
                if (distDedos < 0.05) { 
                    if (!isPinching) {
                        isPinching = true;
                        let minDist = 80;
                        nodoAgarrado = null;
                        nodos.forEach(n => {
                            let d = Math.hypot(manoX - n.x, manoY - n.y);
                            if (d < minDist) { minDist = d; nodoAgarrado = n; }
                        });
                    }
                } else { 
                    isPinching = false;
                    // Si se suelta el agarre espacial pero no hay agarre táctil
                    if(nodoAgarrado && nodoAgarrado.agarreManual !== true) nodoAgarrado = null;
                }
            } else {
                manoX = -1000; manoY = -1000;
                isPinching = false;
            }
        });

        // ==========================================
        // 2. EXTRACCIÓN DE LATIDO (rPPG)
        // ==========================================
        function calcularBPM_rPPG() {
            if (videoElement.readyState !== 4) return;
            hiddenCanvas.width = videoElement.videoWidth;
            hiddenCanvas.height = videoElement.videoHeight;
            hiddenCtx.drawImage(videoElement, 0, 0);

            let cx = hiddenCanvas.width / 2; let cy = hiddenCanvas.height / 3;
            let frameData = hiddenCtx.getImageData(cx - 25, cy - 25, 50, 50).data;
            
            let sumG = 0; let totalPixels = frameData.length / 4;
            for(let i = 1; i < frameData.length; i += 4) { sumG += frameData[i]; }
            let avgG = sumG / totalPixels;

            let now = performance.now();
            greenSignal.push({val: avgG, time: now});
            if (greenSignal.length > 120) { greenSignal.shift(); }

            if (greenSignal.length > 30) {
                let mean = greenSignal.reduce((a, b) => a + b.val, 0) / greenSignal.length;
                let current = greenSignal[greenSignal.length - 1];
                let previous = greenSignal[greenSignal.length - 2];

                if (previous.val >= mean && current.val < mean) {
                    let timeDiff = current.time - lastPeakTime;
                    if (timeDiff > 330 && timeDiff < 1300) { 
                        let instantBPM = Math.round(60000 / timeDiff);
                        latidoReal = Math.round((latidoReal * 0.7) + (instantBPM * 0.3));
                        bpmValue.innerText = latidoReal;
                    }
                    lastPeakTime = current.time;
                }
            }
        }

        // ==========================================
        // 3. INICIALIZACIÓN DUAL DE LA CÁMARA
        // ==========================================
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                cameraStatus.innerText = "Sensores Ópticos y Hápticos: ACTIVOS";
                cameraStatus.style.color = "#5cb85c";
                // Ejecución Dual: Manos + Corazón
                await hands.send({image: videoElement}); 
                calcularBPM_rPPG();
            },
            width: 640, height: 480
        });
        camera.start();

        // ==========================================
        // SISTEMA TÁCTIL Y DE RESPALDO (C-TOUCH)
        // ==========================================
        function down(e) {
            mouseX = e.touches ? e.touches[0].clientX : e.clientX;
            mouseY = e.touches ? e.touches[0].clientY : e.clientY;
            let minDist = 60;
            nodoAgarrado = null;
            nodos.forEach(n => {
                let d = Math.hypot(mouseX - n.x, mouseY - n.y);
                if (d < minDist) { minDist = d; nodoAgarrado = n; nodoAgarrado.agarreManual = true; }
            });
        }
        function up() { if(nodoAgarrado) nodoAgarrado.agarreManual = false; nodoAgarrado = null; }
        function move(e) { 
            mouseX = e.touches ? e.touches[0].clientX : e.clientX; 
            mouseY = e.touches ? e.touches[0].clientY : e.clientY; 
        }

        window.addEventListener('mousedown', down);
        window.addEventListener('mouseup', up);
        window.addEventListener('mousemove', move);
        window.addEventListener('touchstart', down, {passive: false});
        window.addEventListener('touchend', up);
        window.addEventListener('touchmove', move, {passive: false});

        // ==========================================
        // 4. MOTOR BINARIO (DIBUJO Y FÍSICA)
        // ==========================================
        class Nodo {
            constructor(x, y, tipo) {
                this.x = x; this.y = y; this.tipo = tipo;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.fase = Math.random() * Math.PI * 2;
                this.agarreManual = false;
            }

            actualizar(speedFactor) {
                this.x += this.vx * speedFactor;
                this.y += this.vy * speedFactor;
                if (this.x <= 0 || this.x >= width) this.vx *= -1;
                if (this.y <= 0 || this.y >= height) this.vy *= -1;
                this.vx *= 0.98; this.vy *= 0.98; 
            }
        }

        function generar() {
            ctx.fillStyle = '#F0EAD6';
            ctx.fillRect(0, 0, width, height);
            nodos = [];
            const bin = nameInput.value.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('');
            for (let i = 0; i < bin.length; i++) {
                nodos.push(new Nodo(Math.random() * width, Math.random() * height, parseInt(bin[i])));
            }
        }

        function dibujar() {
            let speedFactor = latidoReal / 75; 
            tiempo += 0.02 * speedFactor;

            // Veladura Abstracta
            ctx.fillStyle = 'rgba(240, 234, 214, 0.015)'; 
            ctx.fillRect(0, 0, width, height);

            nodos.forEach((a, i) => {
                if (a === nodoAgarrado) {
                    // Decide si obedece a la mano en el aire o al toque físico
                    a.x = a.agarreManual ? mouseX : manoX; 
                    a.y = a.agarreManual ? mouseY : manoY;
                    a.vx = 0; a.vy = 0;
                } else {
                    a.actualizar(speedFactor);
                }

                for (let j = i + 1; j < nodos.length; j++) {
                    let b = nodos[j];
                    let dx = b.x - a.x, dy = b.y - a.y;
                    let d = Math.hypot(dx, dy);

                    if (d < 150) {
                        if (a.tipo === 1 && b.tipo === 1) {
                            let distIdeal = 80;
                            let tension = (d - distIdeal) * 0.001;
                            if (a !== nodoAgarrado) { a.vx += dx * tension; a.vy += dy * tension; }
                            if (b !== nodoAgarrado) { b.vx -= dx * tension; b.vy -= dy * tension; }

                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(34, 34, 34, ${0.1 * (1 - d/150)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        } else if (a.tipo === 0 && b.tipo === 0 && d < 30) {
                            a.vx -= dx * 0.05; a.vy -= dy * 0.05;
                        }
                    }
                }

                ctx.beginPath();
                let radio = a.tipo === 1 ? 2 + Math.sin(tiempo + a.fase) : 1;
                ctx.arc(a.x, a.y, radio, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(34, 34, 34, 0.4)';
                ctx.fill();
            });

            // Dibujar cursor de la IA espacial (Manos en el aire)
            if (manoX > 0) {
                ctx.beginPath();
                ctx.arc(manoX, manoY, isPinching ? 10 : 5, 0, Math.PI * 2);
                ctx.strokeStyle = isPinching ? '#222222' : 'rgba(34, 34, 34, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            requestAnimationFrame(dibujar);
        }

        generateBtn.addEventListener('click', generar);
        generar();
        dibujar();
    </script>
</body>
</html>
